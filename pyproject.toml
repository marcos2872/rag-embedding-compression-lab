[project]
name = "rag-embedding-compression-lab"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "faiss-cpu>=1.7",
  "sentence-transformers>=2.7",
  "scikit-learn>=1.4",
  "typer[all]>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.20",
  "kaleido>=0.2",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "pymupdf>=1.24",
  "openai>=2.31.0",
]

[project.scripts]
lab = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "ipykernel>=6",
  "jupyter>=1",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
